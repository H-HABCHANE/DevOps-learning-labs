name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 02-appli-python
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: 02-appli-python/requirements-dev.txt

      - name: Installer les outils
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: python -m pytest -v

      - name: Résumé en cas d'échec
        if: failure()
        run: |
          echo "## ❌ Échec du job tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Relancer en local : \`ruff check .\` puis \`python -m pytest -v\`" >> "$GITHUB_STEP_SUMMARY"

  publier-image:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: hhabchane/prix-ttc
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Vérifier les secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Secret DOCKERHUB_USERNAME ou DOCKERHUB_TOKEN manquant (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "Compte Docker Hub : $DOCKERHUB_USERNAME"

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: 02-appli-python
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
